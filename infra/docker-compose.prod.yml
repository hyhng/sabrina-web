# The server stack (docs/TECH.md 7): Caddy for TLS, Postgres, the admin.
#
# Deliberately not the same file as docker-compose.yml, which exists so a
# developer can run a database on a laptop. This one carries no default
# passwords and no published database port: everything it needs comes from .env
# beside it, and nothing but 80 and 443 is reachable from outside.
#
#   docker compose -f infra/docker-compose.prod.yml up -d
#
# On the server, see infra/README.md for the whole sequence.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?set ADMIN_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Losing this volume means asking Let's Encrypt
      # for new ones, which is rate-limited — it is worth keeping.
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    depends_on:
      - cms

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    # No ports: the database is reachable from the other containers and from
    # nowhere else. `docker compose exec db psql` is how you get at it.
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 10

  cms:
    image: ${CMS_IMAGE:-ghcr.io/hyhng/sabrina-cms:latest}
    restart: unless-stopped
    environment:
      DATABASE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env}
      # Everything below is optional: the admin says which one is missing when
      # a feature that needs it is used.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      CF_DEPLOY_HOOK_URL: ${CF_DEPLOY_HOOK_URL:-}
      # Where „Zobrazit web“ in the admin leads; the Pages address when unset.
      SITE_URL: ${SITE_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      NEXT_PUBLIC_IMG_BASE: ${IMG_BASE_URL:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  caddy-data:
  caddy-config:
  caddy-logs:
